# Example YAML config for scminerViewer::prepare_study().
#
# Run with:
#   Rscript -e 'scminerViewer::prepare_study("example_config.yml")'
#
# Writes:
#   <output>/Study/, Cell/, Gene/, Network_*/, study_meta/<studyID>_study_meta.csv,
#   <output>/study_gene_{expression,tf,sig}/<studyID>_*.csv  (manifests)
#   <output>/expression_files/<studyID>/{meta.csv, <letter>/<gene>.csv.gz}
#   <output>/activity_files/<studyID>/{meta.csv, TF|SIG/<letter>/<gene>.csv.gz}
#   <output>/<studyID>.scminer.h5         (the lazy-mode bundle)

# ---- Where to write everything --------------------------------------------
output: data        # writes data/2327.scminer.h5 + the shard tree

# ---- Study identity -------------------------------------------------------
study:
  ID:         "2327"
  studyAbbr:  tex
  longTitle:  >
    Single-cell RNA sequencing of progenitor, intermediate and
    terminally exhausted CD8+ T cells from tumors and chronic viral
    infection
  shortTitle: Tex

# ---- Sample-level metadata (also used as scminer_study$meta fields) -------
species:    Mus musculus    # also written into manifests' Species column
coordinate: UMAP            # display label AND the pData column prefix —
                            # i.e. the eset must carry `<coordinate>_1` /
                            # `<coordinate>_2` columns (here UMAP_1 / UMAP_2).
                            # `coordinateName:` is accepted as an alias.

# ---- Optional: explicit coordinate column names ---------------------------
# Use these when the embedding columns DON'T follow the `<stem>_1` /
# `<stem>_2` convention -- e.g. spatial-transcriptomics studies where
# the columns are X / Y (or `tSNE.1` / `tSNE.2`). When both are given
# they override the stem-based lookup above; `coordinate:` is then used
# only as the display label on the axes. Pair with `coordinateName:` to
# keep the display name distinct from any column-name stem.
#
#   coordinate_1: X
#   coordinate_2: Y
#   coordinateName: tSNE

# ---- Cluster colour palette -----------------------------------------------
# Auto-fills the Color column of study_meta.csv (and the bundle's
# clusters/color group) with a palette from ggsci. Default is the
# Nature Publishing Group (npg) palette. Other choices:
#   aaas, lancet, nejm, jama, jco, ucscgb, d3, locuszoom, igv,
#   uchicago, startrek, tron, futurama, rickandmorty, simpsons
# See https://cran.r-project.org/web/packages/ggsci/vignettes/ggsci.html
cluster_palette: npg

# Cluster label positions (label_1 / label_2 columns) are auto-computed
# from the centroids of each cell type — i.e. mean(coord1) /
# mean(coord2) over the cells in that cluster. No knob needed.

# ---- pData / fData column names in the source ExpressionSet ---------------
# These tell prepare_study_from_eset() which pData columns to pull. The
# defaults shown here match scMINER conventions.
cellID:     cellID          # rownames are also used; this column is added
                            # automatically if absent
cellType:   cellGroup       # label column in pData
cellGroup:  cellGroup       # optional; falls back to cellType
geneSymbol: geneSymbol      # column in fData carrying the gene symbol

# ---- Input files (RDS / TSV) read by prepare_study_from_eset() ------------
input:
  # Required: a Biobase ExpressionSet RDS with the expression matrix.
  expression: inputs/2327_expression.rds

  # Optional: a second Biobase ExpressionSet with the activity matrix.
  # Row names must end in _TF / .TF or _SIG / .SIG; prepare_study splits
  # those rows into activity_tf and activity_sig automatically.
  activity:   inputs/2327_activity.rds

  # Optional: a tab-separated networks file with at least these columns:
  #   source, target, NetworkType (TF|SIG), CellGroup,
  #   mi, pearson, spearman, rho, pvalue
  networks:   inputs/2327_networks.tsv

# ---- Default genes pre-selected on app launch (optional) ----------------
# The Shiny app auto-selects these genes the first time a user opens
# this study, so every visitor sees a useful initial view. Mirrors the
# scMINER Portal's `preGenes` mechanic. Any of these four shapes are
# accepted; pick whichever reads cleanest:
#
#   default_genes: [Cd36, Pdpn, Meox1]              # explicit list
#   default_genes: "Cd36, Pdpn, Meox1"              # comma-separated
#   defaults:                                        # nested form
#     genes: [Cd36, Pdpn, Meox1]
#   preGenes: "Cd36, Pdpn, Meox1"                   # legacy alias
#
# Genes that aren't in the bundle's master gene index are dropped with
# a warning at prepare time, so the on-disk defaults/genes is always
# referentially valid.
default_genes: [Cd36, Pdpn, Meox1]
