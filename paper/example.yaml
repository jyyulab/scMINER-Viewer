# Per-study config consumed by scminerViewer::prepare_study().
# Mirrors the layout of pData(expression.rds) and fData(expression.rds).
output: /home/hzhou98/hzhou/scMINERViewerMetrics

study:
  ID:         "2327"
  studyAbbr:  Tex
  shortTitle: Tex
  longTitle:  T-cell exhaustion (Tex) reference

species:     mouse
coordinate:  UMAP

# Column conventions inside the ExpressionSet
cellID:      CellID
cellType:    CellGroup
cellGroup:   CellGroup
geneSymbol:  GeneSymbol

# Inputs (paths are resolved relative to this YAML's parent dir
# inside the driver; portal_studies.R / prepare_study() use them
# directly via readRDS / read.table)
input:
  expression: expression.rds
  activity:   activity.rds
  networks:   networks.txt

cluster_palette: npg
input_root: ../../data/input/2327
