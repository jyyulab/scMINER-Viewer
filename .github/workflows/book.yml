name: Build & deploy bookdown

on:
  push:
    branches: [main]
    paths:
      - "book/**"
      - "scminerViewer/R/**"          # R API reference is partly auto-derived
      - "scminer_viewer/src/**"
      - "README.md"
      - ".github/workflows/book.yml"
  workflow_dispatch:                  # allow manual runs

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write                 # needed to push to gh-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true

      - name: Setup R Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install bookdown deps
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::bookdown
            any::rmarkdown
            any::knitr

      - name: Render bookdown
        run: |
          # Force output to book/_book/ for the CI run (the deployment
          # step uploads that directory as the Pages artifact, so we
          # don't depend on the docs/ checkout-in-repo convention).
          cd book
          Rscript -e 'bookdown::render_book("index.Rmd",
                       output_format = "bookdown::gitbook",
                       output_dir    = "_book",
                       quiet         = TRUE)'
          touch _book/.nojekyll

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book/_book
          publish_branch: gh-pages
          force_orphan: true            # keep gh-pages history short
          user_name: "github-actions[bot]"
          user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_message: "deploy: ${{ github.event.head_commit.message }}"
