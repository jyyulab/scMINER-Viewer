[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scminer-viewer"
version = "0.1.0"
description = "Shiny-for-Python webui for scMINER study bundles"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "scMINER Team", email = "scminer@stjude.org" }]
dependencies = [
    "shiny>=1.0",
    "h5py>=3.0",
    "numpy>=1.20",
    "scipy>=1.7",
    "pandas>=1.3",
    "plotly>=5.0",
    "shinywidgets>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.scripts]
scminer-viewer = "scminer_viewer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scminer_viewer"]
